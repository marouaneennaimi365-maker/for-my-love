<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هدية خاصة لكِ مروان من محادثاتنا السابقة</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b1a;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            perspective: 1000px;
        }

        /* خلفية النجوم المتحركة */
        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a1a3a 0%, #050510 100%);
            z-index: 1;
        }

        /* تصميم القلب النابض */
        .heart-container {
            position: absolute;
            z-index: 2;
            cursor: pointer;
            transition: transform 0.5s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .heart {
            background-color: #ff2a55;
            display: inline-block;
            height: 100px;
            position: relative;
            top: 0;
            transform: rotate(-45deg);
            width: 100px;
            animation: beat 1s infinite alternate;
            box-shadow: 0 0 40px #ff2a55;
        }

        .heart:before, .heart:after {
            content: "";
            background-color: #ff2a55;
            border-radius: 50%;
            height: 100px;
            position: absolute;
            width: 100px;
        }

        .heart:before { top: -50px; left: 0; }
        .heart:after { top: 0; left: 50px; }

        @keyframes beat {
            0% { transform: rotate(-45deg) scale(1); box-shadow: 0 0 20px #ff2a55; }
            100% { transform: rotate(-45deg) scale(1.2); box-shadow: 0 0 50px #ff7597; }
        }

        .click-text {
            color: #fff;
            margin-top: 40px;
            font-size: 20px;
            text-shadow: 0 0 10px #fff;
            animation: fade 1s infinite alternate;
        }

        @keyframes fade {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* تصميم كارت الرسالة */
        .card {
            width: 340px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: scale(0);
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 3;
            border: 2px solid #ff2a55;
        }

        .card.open { transform: scale(1); }

        .card h1 { color: #ff2a55; margin-bottom: 20px; font-size: 26px; }
        .card p { color: #444; font-size: 18px; line-height: 1.6; }
        .card .signature { color: #ff2a55; font-weight: bold; margin-top: 20px; display: block; }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="heart-container" id="heartContainer" onclick="openCard()">
        <div class="heart"></div>
        <div class="click-text">اضغطي هنا ❤️</div>
    </div>

    <div class="card" id="loveCard">
        <h1>إلى من أحب ❤️</h1>
        <p>كل يوم معكِ هو يوم مميز في حياتي. أردت أن أقدم لكِ شيئاً مبتكراً ومختلفاً ليعبر لكِ عن مكانتكِ الكبيرة في قلبي.</p>
        <p>أتمنى أن تسعدكِ هذه المفاجأة الرقمية البسيطة!</p>
        <span class="signature">بكل حب، مروان ✨</span>
    </div>

    <!-- موسيقى هادئة تعمل تلقائياً بعد الضغط على القلب -->
    <audio id="bgMusic" src="https://soundhelix.com" loop></audio>

    <script>
        function openCard() {
            // إخفاء القلب
            document.getElementById('heartContainer').style.display = 'none';
            // إظهار الرسالة
            document.getElementById('loveCard').classList.add('open');
            // تشغيل الموسيقى
            document.getElementById('bgMusic').play().catch(error => {
                console.log("المتصفح حظر التشغيل التلقائي حتى يتفاعل المستخدم");
            });
        }
    </script>
</body>
</html>
